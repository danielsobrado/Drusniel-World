# Ambient air of each biome (stylized/ambient/): GPU particle fields per
# region, spindrift plumes off snowy crests, breath in the cold, and the weights
# of effects inside other materials (blown snow and sand streaks, grass gust
# sheen, frost). Ported from grass-test's public/ambient-effects.yaml and
# converted from its ~2.8 units per metre to metres
# (scratchpad convert_ambient_yaml.py); keep the two in step when re-syncing.
#
# Every effect's strength = its region's weight at the focus
#   x its preset weight (`presets`, else `presetDefault`, else 1)
#   x (wind / windReference) ^ windResponse,
# eased at fadeRate per second. Regions: any, snow, sand, surf, jungle, water
# (lake or river nearby), lake (on a lake), meadow (open ground and none of the
# others). Preset names are grass-test's; stylized/ambient/ambientPresets.js
# maps this world's times of day and weather onto them.
#
# Plumes are re-tuned for this world's mountains, not converted: crests here
# stand hundreds of metres apart (MountainRidges), so the scan step, prominence
# radius and spacing are metres at that scale, and the crests must stand above
# the terrain's snow line.
