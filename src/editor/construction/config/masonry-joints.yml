version: 1

# Joint width = total visible gap between neighbouring stones (metres).
# Each stone retracts roughly half of that amount via scaleCorners.

defaults:
  headJoint:
    min: 0.012
    max: 0.030

  bedJoint:
    min: 0.0084
    max: 0.021

  coarseLodMultiplier: 1.0
  mortarSafetyOverlap: 0.003

  minimumRenderedWidth: 0.12
  minimumRenderedHeight: 0.08

styles:
  coursed-rubble:
    headJoint:
      min: 0.024
      max: 0.040

    bedJoint:
      min: 0.018
      max: 0.030

    coarseLodMultiplier: 1.15

  soft-limestone-rubble:
    headJoint:
      min: 0.026
      max: 0.040

    bedJoint:
      min: 0.020
      max: 0.030

    coarseLodMultiplier: 1.20

  # Rounded stones nearly touch at their widest: the rolled rims open each
  # joint into a much wider shadowed crevice, so the solved gap stays narrow.
  # Hairline seams between tightly abutting blocks (docs/reference/tiny-glade).
  glade-sandstone:
    headJoint:
      min: 0.004
      max: 0.008

    bedJoint:
      min: 0.003
      max: 0.006

    coarseLodMultiplier: 1.10

  rounded-fieldstone:
    headJoint:
      min: 0.008
      max: 0.016

    bedJoint:
      min: 0.008
      max: 0.014

    coarseLodMultiplier: 1.10
